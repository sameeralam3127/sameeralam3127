      <text x="395" y="30" fill="#38BDF8" font-family="Verdana, Geneva, sans-serif" font-size="15" font-weight="700">Observe</text>
      <path d="M405 48H451" stroke="#22C55E" stroke-width="5" stroke-linecap="round"/>
