      <text x="214" y="30" fill="#38BDF8" font-family="Verdana, Geneva, sans-serif" font-size="15" font-weight="700">Ship</text>
      <path d="M217 48H263" stroke="#F59E0B" stroke-width="5" stroke-linecap="round"/>

      <path d="M304 36H357" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 6"/>
      <circle cx="360" cy="36" r="5" fill="#22C55E"/>

