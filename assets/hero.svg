<svg width="1280" height="420" viewBox="0 0 1280 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Sameer Alam — DevOps Engineer portfolio banner</title>
  <desc id="desc">Animated DevOps banner for Sameer Alam showing a terminal, CI/CD pipeline stages, and a live metric line over a dark slate background.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1120"/>
      <stop offset="0.5" stop-color="#0E2438"/>
      <stop offset="1" stop-color="#0C332C"/>
    </linearGradient>
    <radialGradient id="glowTeal" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1060 60) scale(420)">
      <stop stop-color="#2DD4BF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowAmber" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(220 400) scale(380)">
      <stop stop-color="#F59E0B" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="230" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="card" x1="720" y1="60" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A" stop-opacity="0.97"/>
      <stop offset="1" stop-color="#0F2E2A" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="414" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <style>
      .sans { font-family: 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
      .flow { stroke-dasharray: 6 8; animation: flow 1.6s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -28; } }
      .draw { animation: draw 3.2s ease-out; }
      @keyframes draw { from { stroke-dasharray: 520; stroke-dashoffset: 520; } to { stroke-dasharray: 520; stroke-dashoffset: 0; } }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
      .rise { animation: rise 0.7s ease-out backwards; }
      .d1 { animation-delay: 0.15s; } .d2 { animation-delay: 0.35s; } .d3 { animation-delay: 0.55s; } .d4 { animation-delay: 0.75s; }
      @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      @media (prefers-reduced-motion: reduce) {
        .pulse, .flow, .cursor, .draw, .rise { animation: none; }
      }
    </style>
  </defs>

  <rect width="1280" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="24" fill="url(#grid)"/>
  <rect width="1280" height="420" rx="24" fill="url(#glowTeal)"/>
  <rect width="1280" height="420" rx="24" fill="url(#glowAmber)"/>
  <rect x="0.5" y="0.5" width="1279" height="419" rx="23.5" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <path d="M0 330C170 292 320 292 500 322C700 355 880 350 1280 262" stroke="#5EEAD4" stroke-opacity="0.12" stroke-width="2"/>

  <!-- Left: identity -->
  <g transform="translate(84 66)">
    <g class="rise">
      <rect width="226" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.08" stroke="#5EEAD4" stroke-opacity="0.3"/>
      <circle class="pulse" cx="24" cy="18" r="6" fill="#34D399"/>
      <text x="44" y="23" class="sans" fill="#CCFBF1" font-size="14" letter-spacing="2.5">DEVOPS ENGINEER</text>
    </g>

    <text x="0" y="118" class="sans rise d1" fill="#F8FAFC" font-size="60" font-weight="700">Sameer Alam</text>
    <text x="0" y="162" class="sans rise d2" fill="#5EEAD4" font-size="23">Cloud &#183; Automation &#183; Monitoring &#183; CI/CD</text>
    <text x="0" y="204" class="sans rise d3" fill="#CBD5E1" font-size="18">Turning manual operations into repeatable, observable systems.</text>

    <g transform="translate(0 244)" class="rise d4">
      <rect width="196" height="46" rx="23" fill="url(#chip)"/>
      <text x="30" y="29" class="sans" fill="#052E2B" font-size="15" font-weight="700">Automation First</text>

      <rect x="212" y="0" width="158" height="46" rx="23" fill="#0B1220" fill-opacity="0.7" stroke="#5EEAD4" stroke-opacity="0.4"/>
      <text x="240" y="29" class="sans" fill="#CCFBF1" font-size="15" font-weight="600">Observability</text>

      <rect x="386" y="0" width="180" height="46" rx="23" fill="#0B1220" fill-opacity="0.7" stroke="#FBBF24" stroke-opacity="0.4"/>
      <text x="414" y="29" class="sans" fill="#FEF3C7" font-size="15" font-weight="600">Infra as Code</text>
    </g>
  </g>

  <!-- Right: terminal card -->
  <g class="rise d2">
    <rect x="720" y="58" width="480" height="304" rx="20" fill="url(#card)" stroke="#FFFFFF" stroke-opacity="0.12"/>

    <!-- title bar -->
    <path d="M720 78C720 66.954 728.954 58 740 58H1180C1191.05 58 1200 66.954 1200 78V96H720V78Z" fill="#020617" fill-opacity="0.55"/>
    <circle cx="746" cy="77" r="6" fill="#F87171"/>
    <circle cx="768" cy="77" r="6" fill="#FBBF24"/>
    <circle cx="790" cy="77" r="6" fill="#34D399"/>
    <text x="960" y="82" text-anchor="middle" class="mono" fill="#94A3B8" font-size="13">sameer@prod: ~/pipeline</text>

    <!-- terminal lines -->
    <g class="mono" font-size="15">
      <text x="752" y="130" fill="#E2E8F0">$ git push origin main</text>
      <text x="752" y="158" fill="#34D399">&#10003; build &#8212; tests passed</text>
      <text x="752" y="186" fill="#34D399">&#10003; deploy &#8212; rolling update complete</text>
      <text x="752" y="214" fill="#5EEAD4">&#9650; uptime 99.99%  &#124;  alerts 0</text>
      <rect class="cursor" x="752" y="228" width="10" height="17" fill="#5EEAD4"/>
    </g>

    <!-- pipeline stages -->
    <g transform="translate(752 264)">
      <rect width="92" height="34" rx="10" fill="#FFFFFF" fill-opacity="0.08" stroke="#5EEAD4" stroke-opacity="0.35"/>
      <text x="46" y="22" text-anchor="middle" class="sans" fill="#CCFBF1" font-size="13" font-weight="600">Build</text>
      <path class="flow" d="M96 17H126" stroke="#5EEAD4" stroke-width="2"/>

      <rect x="130" width="92" height="34" rx="10" fill="#FFFFFF" fill-opacity="0.08" stroke="#38BDF8" stroke-opacity="0.35"/>
      <text x="176" y="22" text-anchor="middle" class="sans" fill="#BAE6FD" font-size="13" font-weight="600">Test</text>
      <path class="flow" d="M226 17H256" stroke="#38BDF8" stroke-width="2"/>

      <rect x="260" width="92" height="34" rx="10" fill="#FFFFFF" fill-opacity="0.08" stroke="#FBBF24" stroke-opacity="0.35"/>
      <text x="306" y="22" text-anchor="middle" class="sans" fill="#FEF3C7" font-size="13" font-weight="600">Deploy</text>
      <path class="flow" d="M356 17H386" stroke="#FBBF24" stroke-width="2"/>

      <rect x="390" width="26" height="34" rx="10" fill="#FFFFFF" fill-opacity="0.08" stroke="#34D399" stroke-opacity="0.35"/>
      <circle class="pulse" cx="403" cy="17" r="5" fill="#34D399"/>
    </g>

    <!-- metric sparkline -->
    <g transform="translate(752 316)">
      <path d="M0 30H414" stroke="#FFFFFF" stroke-opacity="0.1"/>
      <path class="draw" d="M0 26C30 6 56 34 86 16C116 -2 140 30 170 14C202 -2 226 28 258 12C288 -2 316 24 346 10C370 0 392 12 414 6" stroke="url(#spark)" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>
</svg>
