    <circle cx="24" cy="17" r="5" fill="#22C55E"/>
    <text x="42" y="22" fill="#E0F2FE" font-family="Verdana, Geneva, sans-serif" font-size="14" letter-spacing="1.4">DEVOPS PORTFOLIO</text>

    <text x="0" y="108" fill="#FFFFFF" font-family="Verdana, Geneva, sans-serif" font-size="54" font-weight="700">Sameer Alam</text>
    <text x="0" y="152" fill="#BAE6FD" font-family="Verdana, Geneva, sans-serif" font-size="24">Cloud, Automation, Monitoring, CI/CD</text>
