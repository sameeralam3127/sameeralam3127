<svg width="1280" height="430" viewBox="0 0 1280 430" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Sameer Alam DevOps portfolio banner</title>
  <desc id="desc">A polished DevOps profile banner with terminal, cloud, monitoring, and pipeline visuals.</desc>
  <defs>
    <linearGradient id="bg" x1="64" y1="30" x2="1180" y2="404" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08111F"/>
      <stop offset="0.44" stop-color="#102A43"/>
      <stop offset="1" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="panel" x1="780" y1="72" x2="1170" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#0B3A53" stop-opacity="0.88"/>
    </linearGradient>
    <linearGradient id="accent" x1="74" y1="320" x2="372" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.55" stop-color="#22C55E"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" stroke="#FFFFFF" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="430" rx="30" fill="url(#bg)"/>
  <rect width="1280" height="430" rx="30" fill="url(#grid)"/>

  <path d="M0 330C176 282 290 292 455 323C658 361 834 372 1280 247V430H0V330Z" fill="#FFFFFF" fill-opacity="0.045"/>
  <path d="M0 360C187 306 322 307 497 337C671 367 893 376 1280 286" stroke="#BAE6FD" stroke-opacity="0.18" stroke-width="2"/>

  <g opacity="0.35">
